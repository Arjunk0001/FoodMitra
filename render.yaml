services:
  - type: web
    name: foodmitra
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: NPM_CONFIG_LEGACY_PEER_DEPS
        value: "true"
